name: Cost gate

# Blocks PRs whose estimated monthly cost increase exceeds MAX_INCREASE_USD,
# and posts the cost diff as a PR comment.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

env:
  MAX_INCREASE_USD: 250

jobs:
  cost-check:
    name: cost-check
    runs-on: ubuntu-latest
    steps:
      - uses: hashicorp/setup-terraform@v3

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      # 1. Baseline: the target branch
      - name: Checkout target branch (base)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      # Keep the BASE version of the gate script, so a PR cannot weaken its own check
      - name: Save base gate script
        run: cp scripts/cost-gate.sh /tmp/cost-gate.sh

      - name: Estimate base cost
        run: infracost breakdown --path=. --format=json --out-file=/tmp/base.json

      # 2. The PR
      - name: Checkout PR
        uses: actions/checkout@v4

      # Technical checks: offline, mock credentials, nothing is deployed
      - name: Terraform init, validate, plan
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform plan -input=false

      - name: Estimate PR cost
        run: infracost breakdown --path=. --format=json --out-file=/tmp/pr.json

      # 3. Cost diff and PR comment (informational; never masks the gate)
      - name: Cost diff
        run: |
          infracost diff --path=. --compare-to=/tmp/base.json \
            --format=json --out-file=/tmp/diff.json

      - name: Post PR comment
        continue-on-error: true
        run: |
          infracost comment github --path=/tmp/diff.json \
            --repo=$GITHUB_REPOSITORY \
            --github-token=${{ github.token }} \
            --pull-request=${{ github.event.pull_request.number }} \
            --behavior=update

      # 4. Gate
      - name: Cost gate
        env:
          COST_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'cost-approved') }}
        run: bash /tmp/cost-gate.sh /tmp/base.json /tmp/pr.json "$MAX_INCREASE_USD"